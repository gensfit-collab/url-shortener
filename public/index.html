
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Create short, clean and shareable URLs."
  >

  <title>URL Shortener</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="app-container">

    <section class="shortener-card">

      <!-- Header -->
      <header class="header">

        <a
          href="/"
          class="brand"
          aria-label="URL Shortener home"
        >
          <span class="brand-mark">U</span>

          <span class="brand-name">
            URL Shortener
          </span>
        </a>

      </header>


      <!-- Main content -->
      <div class="content">

        <!-- Hero -->
        <section
          class="hero"
          aria-labelledby="page-title"
        >

          <p class="eyebrow">
            LINK MANAGEMENT
          </p>

          <h1 id="page-title">
            Turn long links<br>
            into simple URLs.
          </h1>

          <p class="hero-description">
            Create short, clean links that are easier to share,
            remember, and use.
          </p>

        </section>


        <!-- URL form -->
        <form
          id="url-form"
          class="url-form"
          novalidate
        >

          <div class="form-group">

            <label for="original-url">
              Enter your URL
            </label>

            <p class="input-help">
              Paste the full URL you want to shorten.
            </p>

            <div class="input-container">

              <span
                class="input-prefix"
                aria-hidden="true"
              >
                https://
              </span>

              <input
                type="url"
                id="original-url"
                name="originalUrl"
                placeholder="example.com/your-long-url"
                autocomplete="url"
                inputmode="url"
                spellcheck="false"
                required
                aria-describedby="url-error"
              >

            </div>

            <p
              id="url-error"
              class="message error-message"
              role="alert"
              aria-live="polite"
              hidden
            ></p>

          </div>


          <!-- Submit button -->
          <button
            type="submit"
            id="submit-button"
            class="primary-button"
          >

            <span id="button-text">
              Shorten URL
            </span>

            <span
              id="button-loader"
              hidden
            >
              Shortening...
            </span>

          </button>

        </form>


        <!-- Shortened URL result -->
        <section
          id="result-section"
          class="result-section"
          aria-labelledby="result-title"
          hidden
        >

          <div class="result-header">

            <div>

              <p class="result-eyebrow">
                SHORTENED URL
              </p>

              <h2 id="result-title">
                Your URL is ready
              </h2>

            </div>

            <span class="result-status">
              Ready
            </span>

          </div>


          <div class="result-box">

            <a
              id="short-url"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            ></a>

            <button
              type="button"
              id="copy-button"
              class="copy-button"
            >
              Copy
            </button>

          </div>


          <!-- Copy feedback -->
          <p
            id="copy-message"
            class="message success-message"
            role="status"
            aria-live="polite"
            hidden
          >
            URL copied to clipboard.
          </p>

        </section>


        <!-- API error -->
        <p
          id="api-error"
          class="message error-message api-error"
          role="alert"
          aria-live="polite"
          hidden
        ></p>

      </div>

    </section>

  </main>


  <script src="js/app.js"></script>

</body>
</html>
