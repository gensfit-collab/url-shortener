services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      PORT: 5000
    depends_on:
      url-shortener-postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"

    url-shortener-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: supersecurepassword
      POSTGRES_DB: urlshortener
    ports:
      - "5433:5432"
    volumes:
      - url_shortener_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url-shortener-postgres -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  url_shortener_data:
